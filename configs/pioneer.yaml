# Event paths are the only required edits for another fire using the same rules.
# Relative paths are interpreted relative to this config file.
batch:
  name: pioneer
  pairs:
    - id: pioneer
      pre: /mnt/c/Users/amehedi/Downloads/pioneer/pre.tif
      post: /mnt/c/Users/amehedi/Downloads/pioneer/post.tif
  output_dir: /mnt/c/Users/amehedi/Downloads/pioneer/main_pipeline_run
  mask_dirname: masks

processing:
  reference: pre
  require_same_grid: true
  reproject_post_to_pre: false
  continue_on_error: false
  overwrite: false

terrain:
  g_source: compute_dinf
  alpha: 1.167
  keep_intermediates: true
  # For g_source: raster, supply existing G rasters instead:
  g_dir: null
  g_template: "{id}_G.tif"

stable_cells:
  g_min: null
  g_max: 5.0
  elev_min: null
  elev_max: null
  # Slope thresholds are rise/run, NOT degrees or percent. null disables a rule.
  slope_min: null
  slope_max: null
  # null disables the old raw DoD screen. Set 5.0 only if you want it too.
  dh_abs_max: null
  stable_value: 1
  unstable_value: 0
  nodata_value: 255

quality:
  min_stable_pixels: 1000
  min_stable_fraction: 0.01

# Same production pipeline; translation keeps the tested vertical shift +
# NuthKaab and disables ICP/deramp/directional/aspect stages that caused artifacts.
# Use montecito for the original correction sequence.
corrections:
  preset: translation

# Refine G < 5 for fitting ONLY. Final DEM/DoD retain the full valid overlap.
# Set land_cover: null for G-only fitting on an event without land-cover data.
fitting:
  land_cover: /mnt/c/Users/amehedi/Downloads/pioneer/unzipped_nlcd_2021/Annual_NLCD_LndCov_2021_CU_C1V1.tif
  land_cover_classes: [31, 71]

# Empirical detection threshold, estimated anew from this run's stable residuals.
# Quantile 0.95 is not a validated 95% confidence bound over the whole AOI.
lod:
  method: empirical
  quantile: 0.95
  block_size_m: 250.0
